name: Agent tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so origin/<base_ref> exists for the diff
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --ignore-scripts

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "PR mode: base origin/${{ github.base_ref }}. Analyze, create or update tests, run them and report."
          claude_args: "--agent test-engineer --settings .claude/test-agent.settings.json --max-turns 60"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-results
          path: .agent-results/
          include-hidden-files: true
          if-no-files-found: warn
